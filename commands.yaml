# ==========================================
# Voice-Robot 指令配置文件
# ==========================================

# 基础配置
robot:
  name: "SO-101 LeRobot Arm"
  description: "Remote operation data collection for LeRobot"

# 语音识别配置
speech:
  engine: "ifly"
  language: "zh_cn"
  accent: "mandarin"
  channels: 1
  sample_rate: 16000
  chunk_ms: 80
  vad_eos: 2000
  confidence_threshold: 0.12
  fuzzy_match_threshold: 0.75

llm:
  enabled: true
  intercept_all: false

# 指令定义
commands:
  PICK:
    description: "拿起物体"
    keywords:
      - "主臂抓取"
      - "主臂拿起"
      - "一号抓取"
      - "主臂握紧"
    tts_feedback: "已收到拿起指令"
    action_type: "manipulate"
    timeout: 30

  PLACE:
    description: "放下物体"
    keywords:
      - "主臂放下"
      - "主臂放开"
      - "主臂松开"
      - "放下物体"
    tts_feedback: "已收到放下指令"
    action_type: "manipulate"
    timeout: 30

  STOP:
    description: "停止一切动作"
    keywords:
      - "停止"
      - "紧急停止"
      - "停止所有动作"
      - "停下"
    tts_feedback: "已停止所有动作"
    action_type: "emergency"
    timeout: 5

  ARM_RELAX:
    description: "进入示教模式"
    keywords:
      - "进入调试"
      - "示教模式"
      - "试驾模式"
      - "支教模式"
      - "日教模式"
      - "自觉模式"
      - "松开机械臂"
      - "释放机械臂"
      - "开始学习"
      - "手动模式"
      - "拖动模式"
      - "市调模式"
      - "市郊模式"
      - "视角模式"
    tts_feedback: "已进入示教模式，主臂已释放力矩"
    action_type: "debug"
    timeout: 300

  ARM_LOCK:
    description: "锁定机械臂"
    keywords:
      - "退出调试"
      - "锁定机械臂"
      - "停止示教"
    tts_feedback: "已锁定机械臂"
    action_type: "debug"
    timeout: 5

  RECORD_START:
    description: "开始采集遥操作数据"
    keywords:
      - "开始记录"
      - "开始采集"
      - "数据采集"
    tts_feedback: "开始记录遥操作数据"
    action_type: "data_collection"
    timeout: 300

  RECORD_STOP:
    description: "停止采集遥操作数据"
    keywords:
      - "停止记录"
      - "结束记录"
      - "录好了"
      - "停止数据采集"
      - "采集结束"
    tts_feedback: "停止记录，数据已保存"
    action_type: "data_collection"
    timeout: 10

  GESTURE_RECORD:
    description: "记录主臂姿态"
    keywords:
      - "记录姿态"
      - "记一哈"
      - "记录动作"
      - "存下来"
      - "保存一下"
      - "记下这个"
    tts_feedback: "已记录主臂姿态"
    action_type: "arm_control"
    timeout: 5

  GESTURE_START:
    description: "开始连续录制主臂姿态"
    keywords:
      - "开启录制"
      - "开始示教"
      - "准备学习"
      - "启动学习"
    tts_feedback: "已准备好，请开始操作主臂"
    action_type: "arm_control"
    timeout: 300

  GESTURE_STOP:
    description: "停止连续录制主臂姿态"
    keywords:
      - "停止录制"
      - "录好了"
      - "学完了"
      - "停止识别"
      - "结束识别"
      - "结束录制"
      - "好了"
    tts_feedback: "停止录制"
    action_type: "arm_control"
    timeout: 5

  FOLLOWER_PICK:
    description: "控制从臂抓取"
    keywords:
      - "从臂抓取"
      - "副臂抓取"
      - "腹壁抓取"
      - "从b抓取"
      - "腹b抓取"
      - "2b抓取"
      - "二号抓取"
      - "启动抓取"
    tts_feedback: "二号臂执行抓取"
    action_type: "manipulate"
    timeout: 30

  FOLLOWER_PLACE:
    description: "控制从臂放下"
    keywords:
      - "从臂放下"
      - "副臂放下"
      - "腹壁放下"
      - "腹b放下"
      - "从be放下"
      - "二号放下"
      - "启动放下"
    tts_feedback: "二号臂执行放下"
    action_type: "manipulate"
    timeout: 30

  VLA_DEMO:
    description: "启动视觉演示/分析环境"
    keywords:
      - "启动视觉"
      - "开启视觉"
      - "分析环境"
      - "视觉模式"
    tts_feedback: "视觉系统已就绪，你可以说'帮我抓取小球'"
    action_type: "vla_task"
    timeout: 30

  VISION_GRASP:
    description: "视觉引导抓取指定目标"
    keywords:
      - "帮我抓取"
      - "视觉抓取"
      - "抓住那个"
      - "抓那个"
      - "识别后抓取"
      - "帮我拿那个"
    tts_feedback: "已请求视觉系统抓取目标"
    action_type: "vision_task"
    timeout: 30

# 环境变量覆盖
defaults:
  app_id: "${IFLY_APP_ID}"
  api_key: "${IFLY_API_KEY}"
  api_secret: "${IFLY_API_SECRET}"
  sample_rate: 16000

# 日志与输出
logging:
  log_file: "commands.log"
  cmd_json: "last_command.json"
  lerobot_log: "lerobot_runtime.log"

# LeRobot 集成
lerobot:
  enabled: true
  env_name: "lerobot"
  robot_path: "lerobot/configs/robot/so_101"

# 硬件配置
hardware:
  leader_port: "COM12"
  leader_baudrate: 115200
  follower_port: "COM11"
  record_interval_ms: 100
  gripper_pick_pos: 2600
  gripper_place_pos: 1600
  follower_gripper_pick_pos: 2600
  follower_gripper_place_pos: 1600